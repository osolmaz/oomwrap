[package]
name = "oomwrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Wrap commands that might cause out-of-memory errors, and stop them before they freeze your machine"
readme = "README.md"
homepage = "https://github.com/osolmaz/oomwrap"
repository = "https://github.com/osolmaz/oomwrap"
documentation = "https://docs.rs/oomwrap"
keywords = ["oom", "memory", "process", "cli", "inference"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/.agents/skills/**",
    "/assets/**",
    "/docs/**",
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
nix = { version = "0.30.1", features = ["fs", "process", "signal", "term"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
skillflag = "0.1.0"
tempfile = "3.24.0"

[dev-dependencies]
assert_cmd = "2.1.1"
mutants = "0.0.3"
predicates = "3.1.3"

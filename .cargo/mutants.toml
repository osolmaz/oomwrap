# cargo-mutants settings.
#
# Never mutate code that chooses which process receives a signal. A mutant
# there can turn a target into 0, 1 or -1, or into the wrong set of processes,
# and kill(2) then signals the caller's own process group or every process of
# the user who runs the tests. One mutant of process_group_member_pids that
# returned [-1] did exactly that. These functions are covered by unit tests and
# by the integration suite instead. Mutation tests are optional: run the rest
# only through the `mutants` job of CI (a manual dispatch with the `mutants`
# input), never on a workstation.
exclude_globs = ["src/signal.rs"]
exclude_re = [
    "ProcessId",
    "signal_process_group",
    "process_group_member_pids",
    "process_group_id",
    "process_group_exists",
    "terminate_process_group",
    # The cgroup backend: the members of a scope, and the stop sequence that
    # signals them and writes cgroup.kill.
    "scope_member",
    "signal_scope",
    "terminate_scope",
    "kill_scope",
    "write_cgroup_kill",
    "is_own_scope_dir",
]

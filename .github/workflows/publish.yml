name: Release

# A published GitHub release builds static musl binaries for x86_64 and
# aarch64, runs the test suite and the real-system suite against those exact
# files, attaches them to the release with SHA-256 checksums and build
# provenance attestations, and then publishes the crate with crates.io trusted
# publishing, which names this file. A pull request that changes the build runs
# the same build and tests, without the release steps.
on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/scripts/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: echo "version=$(.github/scripts/crate-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that crates.io has no such version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'oomwrap release workflow' \
            "https://crates.io/api/v1/crates/oomwrap/$VERSION")"
          test "$status" = "404"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      ASSET: oomwrap-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - name: Install the musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        run: .github/scripts/build-suite.sh "$RUNNER_TEMP/suite" --release --target "$TARGET"
      - name: Check that the binaries are static
        run: .github/scripts/check-static.sh "$RUNNER_TEMP/suite/oomwrap" "$RUNNER_TEMP/suite/real_system"
      - name: Name the release binary
        run: |
          mv "$RUNNER_TEMP/suite/oomwrap" "$RUNNER_TEMP/suite/$ASSET"
          sha256sum "$RUNNER_TEMP/suite/$ASSET" | tee "$RUNNER_TEMP/built.sha256"
      - name: Test the release binary
        run: |
          OOMWRAP_TEST_BIN="$RUNNER_TEMP/suite/$ASSET" \
            cargo test --release --locked --target "$TARGET" --workspace --all-targets
      - name: Check that the tests left the binary as built
        run: sha256sum --check "$RUNNER_TEMP/built.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.arch }}
          path: ${{ runner.temp }}/suite/
          if-no-files-found: error

  # The real-system suite against the release binaries, on the runner matrix
  # of the Real system workflow.
  host:
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ASSET: oomwrap-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: suite-${{ matrix.arch }}
          path: ${{ runner.temp }}/suite
      - name: Make the binaries executable
        run: chmod +x "$RUNNER_TEMP/suite/$ASSET" "$RUNNER_TEMP/suite/real_system"
      - name: Start a user manager
        run: .github/scripts/start-user-manager.sh
      - name: Real-system suite
        env:
          OOMWRAP_REAL_SYSTEM: host
        run: OOMWRAP_TEST_BIN="$RUNNER_TEMP/suite/$ASSET" "$RUNNER_TEMP/suite/real_system"

  container:
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ASSET: oomwrap-${{ needs.validate.outputs.version }}-${{ matrix.arch }}-linux-musl
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: suite-${{ matrix.arch }}
          path: ${{ runner.temp }}/suite
      - name: Make the binaries executable
        run: chmod +x "$RUNNER_TEMP/suite/$ASSET" "$RUNNER_TEMP/suite/real_system"
      - name: Real-system suite in a container
        run: |
          docker run --rm --memory 768m --memory-swap 768m \
            --volume "$RUNNER_TEMP/suite:/opt/suite:ro" \
            --env OOMWRAP_REAL_SYSTEM=container \
            --env "OOMWRAP_TEST_BIN=/opt/suite/$ASSET" \
            ubuntu:24.04 /opt/suite/real_system

  attach:
    if: github.event_name == 'release'
    needs: [validate, build, host, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: suite
      - name: Collect the release binaries
        run: |
          mkdir release
          for arch in x86_64 aarch64; do
            cp "suite/suite-$arch/oomwrap-$VERSION-$arch-linux-musl" release/
          done
          chmod +x release/*
          (cd release && sha256sum oomwrap-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/oomwrap-*
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"

  # Trusted publishing: crates.io trusts this workflow of this repository and
  # gives it a token that lasts 30 minutes, which the action revokes at the
  # end of the job. No secret holds a token.
  crates-io:
    if: github.event_name == 'release'
    needs: attach
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: cargo package --locked
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        # cargo reads a registry token from this variable; here it holds the
        # short-lived token of the step above.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

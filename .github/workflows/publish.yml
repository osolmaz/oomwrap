name: Publish crate

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import subprocess

          metadata = subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          )
          packages = json.loads(metadata)["packages"]
          print(next(package["version"] for package in packages if package["name"] == "oomwrap"))
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Confirm version is unpublished
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import subprocess

          metadata = subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          )
          packages = json.loads(metadata)["packages"]
          print(next(package["version"] for package in packages if package["name"] == "oomwrap"))
          PY
          )"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'oomwrap release workflow' \
            "https://crates.io/api/v1/crates/oomwrap/${version}")"
          test "${status}" = "404"
      - name: Check
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Package
        run: cargo package --locked
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

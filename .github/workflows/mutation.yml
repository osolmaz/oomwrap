name: Mutation tests

# Optional. Mutation tests are not part of CI, of a finished change or of a
# release. Start this workflow by hand only. It runs on a throwaway GitHub
# runner, because a mutant of code that sends signals can reach processes
# that the tests did not start; `.cargo/mutants.toml` keeps cargo-mutants out
# of the functions that choose signal targets.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutation test changed lines
        run: |
          git diff --unified=0 origin/main...HEAD > mutation.diff || git diff --unified=0 HEAD~1...HEAD > mutation.diff
          cargo mutants --workspace --in-diff mutation.diff --timeout 60 --caught --unviable
      - name: Keep the mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

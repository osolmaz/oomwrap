name: CI

on:
  workflow_dispatch:
    inputs:
      mutants:
        description: Also run the optional mutation tests of the changed lines
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  SLOPHAMMER_VERSION: 0.4.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --fail-under-lines 85
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit
        run: cargo audit
      - name: Install slophammer-rs
        run: cargo install slophammer-rs --version "$SLOPHAMMER_VERSION" --locked
      - name: Slophammer DRY
        run: slophammer-rs dry . --format json
      - name: Slophammer boundaries
        run: slophammer-rs boundaries . --format json
      - name: Slophammer unsafe
        run: slophammer-rs unsafe . --format json
      - name: Slophammer aggregate
        run: slophammer-rs check . --format json
      - name: Slophammer
        uses: osolmaz/slophammer@main
        with:
          checker: rs
          version: ${{ env.SLOPHAMMER_VERSION }}
          args: check .

  # Optional. Mutation tests are not part of CI, of a finished change or of a
  # release. This job runs only on a manual dispatch with the `mutants` input,
  # on a throwaway runner, because a mutant of code that sends signals can
  # reach processes that the tests did not start; `.cargo/mutants.toml` keeps
  # cargo-mutants out of the functions that choose signal targets.
  mutants:
    if: github.event_name == 'workflow_dispatch' && inputs.mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutation test changed lines
        run: |
          git diff --unified=0 origin/main...HEAD > mutation.diff || git diff --unified=0 HEAD~1...HEAD > mutation.diff
          cargo mutants --workspace --in-diff mutation.diff --timeout 60 --caught --unviable
      - name: Keep the mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

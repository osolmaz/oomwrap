<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="oomwrap: one command enters a process-scoped wrapper that watches RAM and swap floors and stops the owned process group with SIGTERM then SIGKILL before the host freezes">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .node { fill: #161b22; stroke-width: 2; }
      .nodelabel { fill: #e6edf3; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .meterlabel { fill: #8b949e; font-size: 11px; text-anchor: end; }
      .track { fill: #21262d; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#f85149"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d29922"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Left: name, tagline, command line (content spans y 76-244, centered on 160) -->
  <g>
    <text x="56" y="110" class="mono" font-size="46" font-weight="700">
      <tspan fill="#58a6ff">oom</tspan><tspan fill="#e6edf3">wrap</tspan>
    </text>
    <text x="56" y="148" class="sans" font-size="17" fill="#8b949e">Process-scoped memory protection for one command.</text>
    <text x="56" y="174" class="sans" font-size="17" fill="#8b949e">Stops its process group before the host freezes.</text>

    <rect x="56" y="200" width="392" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="74" y="228" class="mono" font-size="15">
      <tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" dx="8">oomwrap run --min-mem 8G -- ./build.sh</tspan>
    </text>
  </g>

  <!-- Command enters the wrapper -->
  <line x1="456" y1="222" x2="538" y2="222" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: the wrapper (content spans y 52-272, centered on 162) -->
  <g>
    <rect x="520" y="52" width="384" height="220" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="536" y="74" class="mono" font-size="12">
      <tspan fill="#58a6ff" font-weight="700">oomwrap</tspan><tspan fill="#8b949e">&#160;· watches RAM and swap floors</tspan>
    </text>
    <text x="884" y="86" class="sans" font-size="10" fill="#f85149" text-anchor="end">host freezes</text>

    <!-- Meters: used memory grows toward the floor line; past it the host freezes -->
    <text x="574" y="103" class="mono meterlabel">RAM</text>
    <rect class="track" x="584" y="94" width="300" height="10" rx="5"/>
    <rect x="824" y="94" width="60" height="10" rx="5" fill="#f85149" fill-opacity="0.22"/>
    <rect x="584" y="94" width="206" height="10" rx="5" fill="#58a6ff"/>

    <text x="574" y="127" class="mono meterlabel">swap</text>
    <rect class="track" x="584" y="118" width="300" height="10" rx="5"/>
    <rect x="824" y="118" width="60" height="10" rx="5" fill="#f85149" fill-opacity="0.22"/>
    <rect x="584" y="118" width="112" height="10" rx="5" fill="#58a6ff"/>

    <!-- Floor line across both meters -->
    <line x1="824" y1="88" x2="824" y2="136" stroke="#d29922" stroke-width="2"/>
    <text x="824" y="154" class="mono" font-size="11" fill="#d29922" text-anchor="middle">floor</text>

    <!-- Floor crossed -> stop -->
    <line x1="824" y1="160" x2="824" y2="202" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
    <rect class="node" x="756" y="204" width="128" height="36" rx="8" stroke="#f85149"/>
    <text x="820" y="219" class="mono nodelabel" fill="#f85149">SIGTERM → SIGKILL</text>
    <text x="820" y="233" class="mono" font-size="10" fill="#8b949e" text-anchor="middle">exit 137</text>

    <!-- Stop signal goes only to the owned process group -->
    <line x1="756" y1="222" x2="718" y2="222" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Owned process group -->
    <rect x="540" y="186" width="176" height="60" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="552" y="200" class="sans" font-size="10" fill="#8b949e">owned process group</text>

    <rect class="node" x="552" y="210" width="44" height="24" rx="7" stroke="#58a6ff"/>
    <text class="mono nodelabel" x="574" y="226">cmd</text>

    <rect class="node" x="604" y="210" width="48" height="24" rx="7" stroke="#8b949e"/>
    <text class="mono nodelabel" x="628" y="226">child</text>

    <rect class="node" x="660" y="210" width="48" height="24" rx="7" stroke="#8b949e"/>
    <text class="mono nodelabel" x="684" y="226">child</text>

    <!-- Normal path -->
    <text x="552" y="262" class="mono" font-size="11" fill="#3fb950">&#10003; normal exit → child exit code</text>
  </g>
</svg>
